<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorldVibe</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial;overflow:hidden}
#feed{width:100%;height:100%;overflow:auto}
.card{position:relative;width:100%;height:100vh;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.85));pointer-events:none}
.info{position:absolute;left:16px;bottom:85px}
.actions{position:absolute;right:15px;bottom:110px;display:flex;flex-direction:column;gap:20px;z-index:20}
button{border:0;background:transparent;color:white;font-size:25px}
small{display:block;font-size:11px}
.upload{position:fixed;right:18px;bottom:68px;background:white;color:black;border-radius:50%;width:55px;height:55px;z-index:5}
nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:#050505;display:flex;justify-content:space-around;align-items:center;z-index:4}
nav button{font-size:21px}
nav span{display:block;font-size:9px}
</style>
</head>
<body>

<div id="feed">
<section class="card">
<video id="video" autoplay muted loop playsinline
src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>

<div class="shade"></div>

<div class="info">
<b>@worldvibe</b>
<p>Welcome to ShortVibe 🎬</p>
<span>#shortvideo #fun</span>
</div>

<div class="actions">
<button onclick="like()">❤️<small id="likes">0</small></button>
<button onclick="share()">↗️<small>Share</small></button>
<button onclick="comment()">💬<small id="commentCount">0</small></button>
<button onclick="sound()">🔇<small>Sound</small></button>
</div>
</section>
<div id="commentsBox" style="position:absolute;left:15px;bottom:155px;z-index:20;font-size:14px;max-width:70%;"></div>
</div>
<input id="file" type="file" accept="video/*" hidden>
<button class="upload" onclick="document.getElementById('file').click()">＋</button>

<nav>
<button>⌂<span>Home</span></button>
<button>🔎<span>Search</span></button>
<button onclick="document.getElementById('file').click()">＋<span>Upload</span></button>
<button>♡<span>Following</span></button>
<button onclick="document.getElementById('profileBox').style.display='block'">👤<span>Profile</span></button>
</nav>
<div id="profileBox" style="display:none;position:fixed;inset:0;background:#111;color:white;z-index:50;padding:25px 18px;overflow:auto;">

<button onclick="document.getElementById('profileBox').style.display='none'"
style="position:absolute;right:15px;top:15px;font-size:25px;">✕</button>

<div style="text-align:center;margin-top:35px;">
<div style="width:90px;height:90px;border-radius:50%;background:#333;margin:auto;display:flex;align-items:center;justify-content:center;font-size:45px;">
<img id="profilePhoto" style="width:100%;height:100%;object-fit:cover;display:none;">
<span id="profileIcon" style="font-size:45px;">👤</span>
</div>

<input id="profilePhotoInput" type="file" accept="image/*" hidden>

<button onclick="document.getElementById('profilePhotoInput').click()"
style="background:white;color:black;border-radius:10px;padding:10px 20px;font-size:15px;margin-top:15px;">
📷 Change Photo
</button>
</div>

<h2 style="margin-bottom:5px;">@worldvibe</h2>
<p style="color:#aaa;">WorldVibe 🌍</p>
<button onclick="editProfile()" style="background:white;color:black;border-radius:10px;padding:10px 30px;font-size:16px;">
✏️ Edit Profile
</button>
</div>

<div style="display:flex;justify-content:space-around;text-align:center;margin:30px 0;">
<div><b>0</b><small>Videos</small></div>
<div><b>0</b><small>Followers</small></div>
<div><b>0</b><small>Following</small></div>
<div><b>0</b><small>Likes</small></div>
</div>

<hr style="border-color:#333;">

<h3>🎬 My Videos</h3>
<div style="text-align:center;color:#888;padding:40px 0;">
No videos yet
</div>

</div>
<div style="position:fixed;top:15px;left:15px;z-index:10;font-size:24px;font-weight:bold;">
WorldVibe 🌍
</div>
<script>
let n=0;

let liked=false;
function editProfile(){
 let name=prompt("Enter your name:");
 if(name){
  document.querySelector("#profileBox h2").innerText="@"+name;
 }
}

document.getElementById("profilePhotoInput").onchange=function(){
 if(this.files[0]){
  let photo=document.getElementById("profilePhoto");
  let icon=document.getElementById("profileIcon");

  photo.src=URL.createObjectURL(this.files[0]);
  photo.style.display="block";
  icon.style.display="none";
 }
};
function like(){
 if(liked){
  n--;
  liked=false;
 }else{
  n++;
  liked=true;
 }
 document.getElementById("likes").innerText=n;
}
function comment(){
 let text=prompt("Write your comment:");
 if(text){
  let count=document.getElementById("commentCount");
  count.innerText=Number(count.innerText)+1;

  let box=document.getElementById("commentsBox");
  let newComment=document.createElement("div");
  newComment.innerText="💬 "+text;
  newComment.style.marginTop="8px";
  newComment.style.background="rgba(0,0,0,.7)";
  newComment.style.padding="8px 12px";
  newComment.style.borderRadius="12px";

  box.appendChild(newComment);
 }
}
function sound(){
 let v=document.getElementById("video");
 v.muted=!v.muted;
}

function share(){
 if(navigator.share){
  navigator.share({
   title:"ShortVibe",
   text:"Check this short video!"
  });
 }else{
  alert("Share feature coming soon");
 }
}

document.getElementById("file").onchange=function(){
 if(this.files[0]){
  let v=document.getElementById("video");
v.src=URL.createObjectURL(this.files[0]);
v.muted=false;
v.controls=true;
v.load();
v.onloadeddata=function(){
 v.play();
};
 }
};
</script>

</body>
</html>
